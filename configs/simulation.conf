[simulation]
sim_load=100
repo_location=https://github.com/lbockenstedt/cs/
repo_branch=main
reboot_schedule=300
dot1x_password=password
dot1x_eap=peap
iperf_bw=1k
kill_switch=off
rapid_update=on
github_repo=on
smb_repo=off
site_based_ssid=on
allow_offline=no
ssidpw_fail=off
auth_fail=off
syslog=off
web_server=on
dns_fail_rate=600
