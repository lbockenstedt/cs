[simulation]
sim_load=100
repo_location=https://github.com/lbockenstedt/cs/
repo_branch=main
reboot_schedule=300
dot1x_password=password
dot1x_eap=peap
iperf_bw=1k
kill_switch=off
rapid_update=on
github_repo=off
smb_repo=off
site_based_ssid=on
allow_offline=no
ssidpw_fail=off
auth_fail=off
syslog=off
web_server=on
dns_fail_rate=1200
dns_fail_duration=600
dns_latency_rate=1200
dns_latency_duration=600
# Max concurrent background dig processes per DNS sim (client CPU ceiling). Tune
# by trial and error to find where a client stays responsive; the DNS_MAX_INFLIGHT
# env var overrides this per manual run. Shared by dns_fail + dns_latency.
dns_max_inflight=100

[server]
server_url=http://169.253.1.1:8080

[address]
smb_address=//nas/scripts
ping_address=172.31.201.3
dns_latency_1=13.239.88.95
dns_latency_2=27.110.152.250
dns_latency_3=165.246.10.2
dns_bad_ip_1=10.252.0.1
dns_bad_ip_2=172.16.252.1
dns_bad_ip_3=192.168.252.1
dns_bad_record_1=10.79.254.90
dns_bad_record_2=10.79.254.91
dns_bad_record_3=10.0.0.10
iperf_server=172.31.201.135
syslog_server=169.253.1.5